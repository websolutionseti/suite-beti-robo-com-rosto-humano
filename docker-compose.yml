version: '3.8'

services:
  # Ambiente de desenvolvimento
  beti-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_APP_ENV=development
    command: npm run dev
    networks:
      - beti-network

  # Ambiente de produção
  beti-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - beti-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beti.rule=Host(`beti.local`)"
      - "traefik.http.services.beti.loadbalancer.server.port=80"

  # Proxy reverso para SSL e cache
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - beti-network

networks:
  beti-network:
    driver: bridge

volumes:
  node_modules: