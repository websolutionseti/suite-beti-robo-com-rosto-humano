name: 🔍 Commit Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: 🔍 Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📂 Install dependencies
        run: npm ci

      - name: 🔍 Validate commit messages
        run: |
          # Get all commit messages from the PR
          git log --format="%s" origin/main..HEAD | while read -r commit_msg; do
            echo "Validating: $commit_msg"
            
            # Check if commit follows conventional commit format
            if [[ ! "$commit_msg" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+ ]]; then
              echo "❌ Invalid commit message format: $commit_msg"
              echo "Expected format: type(scope): description"
              echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              exit 1
            fi
            
            # Check subject length (max 50 characters)
            subject=$(echo "$commit_msg" | cut -d':' -f2- | sed 's/^ *//')
            if [[ ${#subject} -gt 50 ]]; then
              echo "❌ Commit subject too long (${#subject} chars): $commit_msg"
              echo "Maximum 50 characters allowed"
              exit 1
            fi
            
            echo "✅ Valid commit message: $commit_msg"
          done

      - name: ✅ All commits valid
        run: echo "🎉 All commit messages follow conventional commit standards!"